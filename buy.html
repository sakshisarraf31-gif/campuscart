
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Buy | CampusCart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="buy">

  <a class="skip-link" href="#main">Skip to listings</a>

  <header class="top" id="nav"></header>

  <main class="wrap buy-page" id="main">

    <section class="buy-intro reveal">
      <span class="eyebrow">THE CAMPUS MARKETPLACE</span>

      <h1>Find your next
        <span class="highlight-text">campus essential.</span>
      </h1>

      <p class="sub">
        Discover affordable books, electronics, furniture and more
        from students around your campus.
      </p>
    </section>

    <section class="marketplace reveal">

      <div class="section-heading">
        <div>
          <h2>Explore listings</h2>
          <p class="sub" id="count" aria-live="polite"></p>
        </div>

        <span class="market-label">Student to student</span>
      </div>

      <div class="toolbar">

        <input
          id="q"
          type="search"
          placeholder="Search books, cycles, kettles..."
          aria-label="Search listings"
        >

        <select id="modeSel" aria-label="Listing type"></select>

        <select id="sortSel" aria-label="Sort by">
          <option value="new">Newest first</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>

      </div>

      <div class="chips" id="chips" aria-label="Categories"></div>

      <div class="grid" id="grid"></div>

    </section>

  </main>

  <dialog id="detail" aria-label="Listing details"></dialog>

  <script src="app.js"></script>

</body>
</html>
